<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports Tracker 2.0 | My Leagues</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#15263d;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142b4a;color:#fff;padding:20px;text-align:center}header h1{margin:0;font-size:1.55rem}main{max-width:880px;margin:26px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #142b4a0b}h2{margin:0 0 14px}label{display:block;font-weight:650;margin-bottom:7px}input{width:100%;max-width:450px;padding:12px;border:1px solid #b9c7d8;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:#2463a6;color:#fff;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.6}.secondary{background:#e8eef6;color:#20344e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#607189}.league{border:1px solid #dce4ee;border-radius:10px;padding:14px;margin-top:10px}.league strong{font-size:1.05rem}#status{white-space:pre-wrap}#status.error{color:#a21c28}a{color:#2463a6}
</style>
</head>
<body>
<header><h1>⚾ Sports Tracker 2.0</h1><p>League Management</p></header>
<main>
<div class="card"><div class="row"><strong id="account">Checking your session…</strong><button class="secondary" id="signout">Sign out</button><a href="./index.html">Original scoreboard</a></div><p id="status" role="status" aria-live="polite"></p></div>
<section id="workspace" hidden>
<div class="card"><h2>Create a league</h2><form id="createForm"><label for="leagueName">League name</label><div class="row"><input id="leagueName" required maxlength="100" placeholder="Example: Youth Baseball League"></div><label for="season" style="margin-top:14px">Season</label><div class="row"><input id="season" required minlength="1" maxlength="40" placeholder="Example: Spring 2027"><button id="createButton" type="submit">Create league</button></div></form><p class="muted">The league will be associated with your signed-in account, subject to backend permissions.</p></div>
<div class="card"><div class="row"><h2 style="margin:0">My leagues</h2><button id="reload" class="secondary" type="button">Refresh</button></div><div id="leagues" aria-live="polite"><p class="muted">Loading leagues…</p></div></div>
</section>
</main>
<script type="module">
import { CognitoUserPool } from "https://esm.sh/amazon-cognito-identity-js@6.3.15";
const pool=new CognitoUserPool({UserPoolId:"us-east-2_TEYlWvVwP",ClientId:"6g3a1jmmupiog72v26imo4hve6"});
const API="https://qtmj4qlqfb.execute-api.us-east-2.amazonaws.com";
const $=id=>document.getElementById(id);
let currentUser=null;
function status(message,error=false){$("status").textContent=message;$("status").className=error?"error":""}
function session(){return new Promise((resolve,reject)=>{const user=pool.getCurrentUser();if(!user){reject(new Error("Please sign in first."));return}user.getSession((err,s)=>err||!s?.isValid()?reject(err||new Error("Session expired.")):resolve({user,session:s}))})}
async function api(path,options={}){const {session:s}=await session();const response=await fetch(API+path,{...options,headers:{"Authorization":"Bearer "+s.getAccessToken().getJwtToken(),...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})},cache:"no-store"});let data;const body=await response.text();try{data=body?JSON.parse(body):{}}catch{data={message:body}}if(!response.ok)throw new Error(data.message||data.error||"API request failed ("+response.status+")");return data}
function itemsFrom(data){if(Array.isArray(data))return data;if(Array.isArray(data.items))return data.items;if(Array.isArray(data.leagues))return data.leagues;if(Array.isArray(data.data?.items))return data.data.items;return null}
function renderLeagues(items){const container=$("leagues");container.replaceChildren();if(!items.length){const p=document.createElement("p");p.className="muted";p.textContent="No leagues yet. Create your first league above.";container.append(p);return}for(const league of items){const item=document.createElement("div");item.className="league";const title=document.createElement("strong");title.textContent=league.name||league.leagueName||"Unnamed league";item.append(title);const season=league.season||league.seasonName;const detail=document.createElement("p");detail.className="muted";detail.textContent=season?"Season: "+season:"Season not provided";item.append(detail);container.append(item)}}
async function load(){const container=$("leagues");container.textContent="Loading leagues…";try{const data=await api("/v1/leagues");const items=itemsFrom(data);if(!items)throw new Error("The API returned an unexpected league-list format.");renderLeagues(items);status("")}catch(err){container.textContent="Unable to load leagues.";status(err.message,true)}}
$("createForm").addEventListener("submit",async event=>{event.preventDefault();const name=$("leagueName").value.trim(),season=$("season").value.trim();if(!name||season.length<1||season.length>40){status("Enter a league name and a season between 1 and 40 characters.",true);return;}const button=$("createButton");button.disabled=true;status("Creating league…");try{await api("/v1/leagues",{method:"POST",body:JSON.stringify({name,season})});$("leagueName").value="";$("season").value="";status("League created.");await load()}catch(err){status(err.message,true)}finally{button.disabled=false}});
$("reload").addEventListener("click",load);
$("signout").addEventListener("click",()=>{pool.getCurrentUser()?.signOut();location.replace("./v2.html")});
try{const {user,session:s}=await session();currentUser=user;const claims=s.getIdToken().decodePayload();const displayName=typeof claims.name==="string"&&claims.name.trim()?claims.name.trim():(typeof claims.email==="string"&&claims.email.trim()?claims.email.trim():user.getUsername());$("account").textContent="Signed in as "+displayName;$("workspace").hidden=false;await load()}catch(err){$("account").textContent="Not signed in";status(err.message,true);const link=document.createElement("a");link.href="./v2.html";link.textContent="Go to sign in";$("status").append(" ",link)}
</script>
</body></html>
