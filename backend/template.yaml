AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sports Tracker 2.0 independent backend foundation
Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the exact GitHub Pages origin before production
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME:
          Ref: DataTable
Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
    Metadata:
      SamResourceId: DataTable
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
        - Name: verified_email
          Priority: 1
    Metadata:
      SamResourceId: UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
    Metadata:
      SamResourceId: UserPoolClient
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - Ref: AllowedOrigin
        AllowMethods:
        - GET
        - POST
        - PUT
        - OPTIONS
        AllowHeaders:
        - authorization
        - content-type
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
              - Ref: UserPoolClient
            IdentitySource: $request.header.Authorization
    Metadata:
      SamResourceId: HttpApi
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DataTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE
        LeaguesList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues
            Method: GET
        LeaguesCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues
            Method: POST
        LeagueGet:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues/{leagueId}
            Method: GET
        TeamsList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues/{leagueId}/teams
            Method: GET
        TeamsCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues/{leagueId}/teams
            Method: POST
        PlayersList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues/{leagueId}/teams/{teamId}/players
            Method: GET
        PlayersCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/leagues/{leagueId}/teams/{teamId}/players
            Method: POST
    Metadata:
      SamResourceId: ApiFunction
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value:
      Ref: UserPool
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  TableName:
    Value:
      Ref: DataTable
