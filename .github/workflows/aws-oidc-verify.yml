name: Verify AWS OIDC connection (no deployment)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify AWS identity only
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Diagnose OIDC audience and subject (no token logged)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC subject:", claims.get("sub"))
          print("Expected audience: sts.amazonaws.com")
          print("Expected subject: repo:snakeeye182024/SportsTracker:environment:production")
          print("Token itself is not logged.")
          PY
      - name: Configure temporary AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: sports-tracker-oidc-verification
      - name: Verify expected AWS account and assumed role
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="$(aws sts get-caller-identity --output json)"
          ACCOUNT="$(echo "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Account"])')"
          ARN="$(echo "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Arn"])')"
          test "$ACCOUNT" = "814650855040" || { echo "::error::Unexpected AWS account"; exit 1; }
          case "$ARN" in
            arn:aws:sts::814650855040:assumed-role/SportsTrackerGitHubDeploy/*) ;;
            *) echo "::error::Unexpected IAM role"; exit 1 ;;
          esac
          echo "AWS OIDC authentication verified for expected account and deployment role."
          echo "No AWS resources were modified."
