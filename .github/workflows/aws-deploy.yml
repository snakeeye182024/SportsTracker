name: AWS backend offline validation (no deployment)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREVIEW to run an offline SAM build and safety checks'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --template-file backend/template.yaml --lint
      - run: python -m unittest discover -s backend/tests -v

  preview:
    name: Offline SAM build and safety review (no AWS credentials)
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PREVIEW' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - name: Build SAM without accessing AWS
        run: sam build --template-file backend/template.yaml
      - name: Enforce no-execution and protected-resource checks
        run: python3 infra/check_backend_safety.py
      - name: Explain offline preview boundary
        run: |
          echo 'Offline validation complete. No AWS credentials were requested.'
          echo 'No change set was created or executed. Production stack remains untouched.'
