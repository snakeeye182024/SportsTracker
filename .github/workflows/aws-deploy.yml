name: AWS backend change-set preparation (no execution)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREVIEW to create a non-executing production change set'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --template-file backend/template.yaml --lint
      - run: python -m unittest discover -s backend/tests -v

  preview:
    name: Prepare change set only (never execute)
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PREVIEW' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: sports-tracker-production-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: sports-tracker-github-preview
      - uses: aws-actions/setup-sam@v2
      - name: Confirm account and region
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "814650855040"
          test "$AWS_REGION" = "us-east-2"
      - name: Build and create non-executing change set
        run: |
          sam build --template-file backend/template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name sports-tracker-v2 \
            --region us-east-2 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-execute-changeset \
            --no-fail-on-empty-changeset
      - name: Review-only change-set inventory
        run: |
          aws cloudformation list-change-sets --stack-name sports-tracker-v2 --region us-east-2 \
            --query 'Summaries[*].[ChangeSetName,Status,ExecutionStatus]' --output table
          echo 'STOP: This workflow never executes a change set. Review its exact ID and changes separately.'
