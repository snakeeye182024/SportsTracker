name: Sports Tracker 2.0 TEST - validate and deploy

on:
  workflow_dispatch:
    inputs:
      deploy_test:
        description: "Deploy to isolated AWS TEST stack after validation?"
        type: boolean
        required: true
        default: false
      confirmation:
        description: "For deployment type DEPLOY-TEST (leave blank for validation only)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sports-tracker-v2-test-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Stage 1 - Tests and SAM validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install boto3 botocore cfn-lint
      - run: python -m unittest discover -s backend/tests -v
      - uses: aws-actions/setup-sam@v3
      - run: sam validate --template-file backend/template.yaml --lint
      - run: sam build --template-file backend/template.yaml

  deploy:
    name: Stage 2 - Approved TEST-only AWS deployment
    needs: validate
    if: ${{ inputs.deploy_test && inputs.confirmation == 'DEPLOY-TEST' && github.ref == 'refs/heads/feature/v2-live-scoring-foundation' }}
    runs-on: ubuntu-latest
    environment: sports-tracker-v2-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install boto3 botocore cfn-lint
      - uses: aws-actions/setup-sam@v3
      - run: sam validate --template-file backend/template.yaml --lint
      - run: sam build --template-file backend/template.yaml
      - name: Require dedicated TEST deployment role
        env:
          ROLE_ARN: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || { echo "Set AWS_TEST_DEPLOY_ROLE_ARN in protected environment"; exit 1; }
          case "$ROLE_ARN" in
            arn:aws:iam::814650855040:role/SportsTrackerV2TestGitHubDeploy) ;;
            *) echo "Refusing unexpected deployment role"; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Check account and isolated stack
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "814650855040"
          test "$(aws cloudformation describe-stacks --region us-east-2 --stack-name sports-tracker-v2-test --query 'Stacks[0].StackStatus' --output text)" = "UPDATE_COMPLETE" || test "$(aws cloudformation describe-stacks --region us-east-2 --stack-name sports-tracker-v2-test --query 'Stacks[0].StackStatus' --output text)" = "CREATE_COMPLETE"
          ROLE=$(aws cloudformation describe-stacks --region us-east-2 --stack-name sports-tracker-v2-test --query 'Stacks[0].RoleARN' --output text)
          test "$ROLE" = "None" || { echo "Refusing stack with service role"; exit 1; }
      - name: Verify dedicated TEST artifact bucket
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket sports-tracker-v2-test-artifacts-814650855040-us-east-2
          test "$(aws s3api get-bucket-location --bucket sports-tracker-v2-test-artifacts-814650855040-us-east-2 --query LocationConstraint --output text)" = "us-east-2"
      - name: Prepare TEST change set without executing
        run: |
          set -euo pipefail
          sam deploy --template-file .aws-sam/build/template.yaml \
            --stack-name sports-tracker-v2-test \
            --region us-east-2 \
            --s3-bucket sports-tracker-v2-test-artifacts-814650855040-us-east-2 \
            --s3-prefix sam \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides AllowedOrigin=https://snakeeye182024.github.io \
            --no-execute-changeset \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset
      - name: Verify TEST change set before execution
        id: review
        run: |
          set -euo pipefail
          python - <<'PY'
          import boto3
          import os
          from botocore.exceptions import ClientError

          cfn = boto3.client("cloudformation", region_name="us-east-2")
          stack = cfn.describe_stacks(StackName="sports-tracker-v2-test")["Stacks"][0]
          expected_stack_id = stack["StackId"]
          if stack["StackStatus"] not in ("CREATE_COMPLETE", "UPDATE_COMPLETE"):
              raise SystemExit("Refusing deployment: unexpected TEST stack status")
          if stack.get("RoleARN"):
              raise SystemExit("Refusing deployment: TEST stack uses a service role")

          sets = cfn.list_change_sets(StackName="sports-tracker-v2-test")["Summaries"]
          candidates = [
              item for item in sets
              if item["ChangeSetName"].startswith("samcli-deploy")
              and item["Status"] == "CREATE_COMPLETE"
              and item["ExecutionStatus"] == "AVAILABLE"
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected exactly one available SAM TEST change set; found {len(candidates)}. "
                  "Remove stale change sets using an authorized account before retrying."
              )
          selected = candidates[0]
          change_set_arn = selected["ChangeSetId"]
          changes = []
          next_token = None
          while True:
              args = {"ChangeSetName": change_set_arn, "StackName": expected_stack_id}
              if next_token:
                  args["NextToken"] = next_token
              page = cfn.describe_change_set(**args)
              if page["StackId"] != expected_stack_id:
                  raise SystemExit("Change set belongs to a different stack")
              if page["Status"] != "CREATE_COMPLETE" or page["ExecutionStatus"] != "AVAILABLE":
                  raise SystemExit("Change set is not available")
              changes.extend(page.get("Changes", []))
              next_token = page.get("NextToken")
              if not next_token:
                  break

          approved_modifications = {
              ("ApiFunction", "AWS::Lambda::Function"),
              ("HttpApi", "AWS::ApiGatewayV2::Api"),
          }
          for change in changes:
              resource = change.get("ResourceChange", {})
              action = resource.get("Action")
              logical_id = resource.get("LogicalResourceId", "")
              resource_type = resource.get("ResourceType", "")
              replacement = resource.get("Replacement")
              approved = (
                  action == "Modify"
                  and (logical_id, resource_type) in approved_modifications
                  and replacement == "False"
              ) or (
                  action == "Add"
                  and resource_type == "AWS::Lambda::Permission"
                  and logical_id.startswith("ApiFunction")
              )
              print(f"{action}: {logical_id} ({resource_type}), replacement={replacement}")
              if not approved:
                  raise SystemExit("Unapproved change detected; refusing execution")
          if not changes:
              raise SystemExit("No resource changes found; refusing execution")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"change_set_arn={change_set_arn}\n")
              output.write(f"stack_id={expected_stack_id}\n")
          print("Verified TEST stack association and approved resource changes.")
          PY
      - name: Execute verified TEST change set
        env:
          CHANGE_SET_ARN: ${{ steps.review.outputs.change_set_arn }}
          STACK_ID: ${{ steps.review.outputs.stack_id }}
        run: |
          set -euo pipefail
          aws cloudformation execute-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_ID" \
            --region us-east-2
          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_ID" \
            --region us-east-2
      - name: Verify TEST health endpoint
        run: |
          set -euo pipefail
          API=$(aws cloudformation describe-stacks --stack-name sports-tracker-v2-test --region us-east-2 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" --output text)
          curl --fail --silent --show-error "$API/v1/health"
